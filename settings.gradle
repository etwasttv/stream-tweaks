pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // ForgeGradle の一部タスク（Eclipse用 Slime Launcher 設定生成など）は
    // このモッドの Java バージョンとは無関係に固定の Java 8 ツールチェインを要求する。
    // ローカルに Java 8 が無い環境でも自動ダウンロードできるようにする。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_PROJECT
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

rootProject.name = 'stream-tweaks'
include 'fabric', 'neoforge', 'forge'
