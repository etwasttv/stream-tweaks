modLoader = "javafml"
loaderVersion = "[65,)"
license = "MIT"
issueTrackerURL = "https://github.com/aktnb/stream-tweaks-mod-0/issues"
clientSideOnly = true

[[mods]]
modId = "${forge_mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "etwas"
description = '''
A client-side mod that displays Twitch chat directly in Minecraft.
'''
logoFile = "assets/stream-tweaks/icon.png"
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${forge_mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${forge_mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
